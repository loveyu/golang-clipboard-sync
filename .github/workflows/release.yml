name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
          - goos: linux
            goarch: "386"
            runner: ubuntu-latest
          - goos: linux
            goarch: riscv64
            runner: ubuntu-latest
          - goos: linux
            goarch: loong64
            runner: ubuntu-latest
          - goos: linux
            goarch: mipsle
            runner: ubuntu-latest
          - goos: linux
            goarch: mips64le
            runner: ubuntu-latest
          - goos: linux
            goarch: s390x
            runner: ubuntu-latest
          - goos: linux
            goarch: ppc64le
            runner: ubuntu-latest
          # macOS
          - goos: darwin
            goarch: amd64
            runner: macos-latest
          - goos: darwin
            goarch: arm64
            runner: macos-latest
          # Windows
          - goos: windows
            goarch: amd64
            runner: windows-latest
          - goos: windows
            goarch: "386"
            runner: windows-latest
          - goos: windows
            goarch: arm64
            runner: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        shell: bash
        run: |
          if [ "$GOOS" = "windows" ]; then
            EXT=".exe"
          else
            EXT=""
          fi
          OUTPUT="clipboard-sync-${GOOS}-${GOARCH}${EXT}"
          BUILD_TIME=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          GIT_COMMIT=$(echo "${{ github.sha }}" | cut -c1-8)
          VERSION="${GITHUB_REF_NAME#v}"
          go build -ldflags "-s -w -X main.version=${VERSION} -X main.gitBranch=${{ github.ref_name }} -X main.gitCommit=${GIT_COMMIT} -X main.buildTime=${BUILD_TIME}" -o "$OUTPUT" .
          echo "artifact_name=$OUTPUT" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.artifact_name }}
          path: ${{ env.artifact_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare release assets
        run: |
          cp config-example.yaml artifacts/config-example.yaml
          cd artifacts
          sha256sum clipboard-sync-* config-example.yaml > checksums.txt
          cat checksums.txt
          ls -lh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*
